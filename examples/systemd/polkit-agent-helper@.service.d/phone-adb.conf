# Optional example for socket-activated Polkit 128 on systemd 257 or newer.
# Review vendor settings and existing drop-ins before installing.
# This changes the sandbox for ALL instances of this helper template.
[Service]
# Only the existing IPv4 loopback ADB server is needed, not phone-network access.
PrivateNetwork=no
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET
IPAddressDeny=any
IPAddressAllow=127.0.0.1/32

# Keep real home directories hidden. ADB expects HOME/.android to exist even
# when connecting to an existing server. Expose only an empty, dedicated
# root-owned directory at that path, read-only. Adapt /root if root's passwd
# home differs. Do not bind the real root/user ADB key directory.
ProtectHome=tmpfs
StateDirectory=pam-android-fingerprint-adb::ro
StateDirectoryMode=0700
BindReadOnlyPaths=/var/lib/pam-android-fingerprint-adb:/root/.android
